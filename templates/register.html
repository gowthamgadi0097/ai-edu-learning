<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register - AI Learning Assistant</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="auth card">
<h2>Create account</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
<label>Full name</label><input name="name" required>
<label>Email</label><input type="email" name="email" required>
<label>Password (min 6 characters)</label><input type="password" name="password" minlength="6" required>
<label>I am a</label>
<select name="role" id="role"><option value="student">Student</option><option value="teacher">Teacher</option></select>
<div id="codeBox" class="hidden"><label>Teacher access code</label><input name="teacher_code"></div>
<p><button type="submit">Register</button></p>
</form>
<p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
<script>
const r=document.getElementById('role'),b=document.getElementById('codeBox');
r.addEventListener('change',()=>b.classList.toggle('hidden',r.value!=='teacher'));
</script></body></html>
