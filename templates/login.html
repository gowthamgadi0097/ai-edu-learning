<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - AI Learning Assistant</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="auth card">
<h2>AI Learning Assistant</h2><p class="muted">Log in to continue.</p>
{% if registered %}<p class="ok">Account created. Please log in.</p>{% endif %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
<label>Email</label><input type="email" name="email" required>
<label>Password</label><input type="password" name="password" required>
<p><button type="submit">Log in</button></p>
</form>
<p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></body></html>
